    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"

        var t;
        try { t = localStorage.getItem('deepTodoTheme'); } catch(e) {}
        document.documentElement.setAttribute('data-theme', t || 'dark');
      })();
